<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BarTab" />
    <meta name="description" content="Делим счёт за встречи без калькулятора" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1D2623" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet" />
    <title>BarTab</title>
    <style>
      /* экран загрузки до запуска приложения */
      html, body { margin: 0; background: #F1F4F1; }
      @media (prefers-color-scheme: dark) { html, body { background: #121917; } .boot { color: #ECE9E1; } }
      .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #1D2320; font: 700 26px system-ui, sans-serif; }
      .boot img { width: 88px; height: 88px; border-radius: 22px; animation: boot-pulse 1.4s ease-in-out infinite; }
      @keyframes boot-pulse { 50% { transform: scale(.94); opacity: .85; } }
      @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/icon-192.png" alt="" /><div>BarTab</div></div></div>
    <script>
      // Аварийный экран: если приложение не запустилось — показываем ошибку и кнопку сброса
      (function () {
        var errors = [];
        window.addEventListener('error', function (e) { errors.push(e.message || String(e.error)); });
        window.addEventListener('unhandledrejection', function (e) { errors.push(String(e.reason && e.reason.message || e.reason)); });
        window.__bartabReset = function () {
          var jobs = [];
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
          if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
          Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
        };
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.querySelector('.boot')) {
            root.innerHTML = '<div style="max-width:420px;margin:0 auto;padding:60px 20px;font:16px/1.5 system-ui,sans-serif;color:#ECE9E1;background:#121917;min-height:100vh;box-sizing:border-box">' +
              '<h2 style="margin:0 0 12px">BarTab не запустился</h2>' +
              '<p style="color:#99A39E;margin:0 0 16px">Обычно помогает сброс сохранённых файлов. Данные посиделок не пропадут.</p>' +
              '<button onclick="__bartabReset()" style="width:100%;padding:14px;border:0;border-radius:14px;background:#F2A340;color:#1E1406;font-weight:600;font-size:16px">Сбросить кэш и перезагрузить</button>' +
              (errors.length ? '<pre style="white-space:pre-wrap;color:#F27D84;font-size:12px;margin-top:20px">' + errors.join('\n').replace(/</g, '&lt;') + '</pre>' : '') +
              '</div>';
          }
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
