    <rect x="315" y="264" width="8" height="78" rx="3" fill="#1D2623"/>
    <rect x="285" y="338" width="68" height="11" rx="5.5" fill="#1D2623"/>
  </g>
  <!-- дзынь -->
  <g stroke="#FFF6E8" stroke-width="5" stroke-linecap="round">
    <path d="M262 160 L262 136"/>
    <path d="M242 166 L229 147"/>
    <path d="M282 166 L295 147"/>
