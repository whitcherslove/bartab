    <path d="M150 212 H242 L230 346 Q229 358 216 358 H176 Q163 358 162 346 Z" fill="#1D2623"/>
    <path d="M142 219 Q138 192 165 192 Q172 170 196 176 Q217 165 229 186 Q254 184 249 219 Z" fill="#FFF6E8"/>
