  <circle cx="256" cy="256" r="190" fill="#F2A340"/>
  <circle cx="256" cy="256" r="166" fill="none" stroke="#1D2623" stroke-width="5" stroke-dasharray="14 12" opacity=".35"/>

  <!-- пинта стаута, наклонена к коктейлю -->
